[project]
name = "monash-study-kit"
version = "0.1.0"
description = "把 Monash 的 Moodle 和 Ed 接进 Claude：截止日期、公告、课件全文搜索、Ed 帖子，全部在本机。"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
]

[project.optional-dependencies]
# 录播字幕：下载 Zoom 录像并用 whisper 转写、取 YouTube 字幕。依赖大（约 1 GB），想要才装。
media = [
    "faster-whisper>=1.0",
    "yt-dlp[default]>=2025.1.1",
    "deno>=2.0",
]

[project.scripts]
monash = "monash_study_kit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monash_study_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
