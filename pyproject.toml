[project]
name = "monash-study-kit"
dynamic = ["version"]
description = "Connect Monash Moodle and Ed to Claude via a local MCP server and CLI: deadlines, announcements, grades, full-text search over course materials and Ed posts, all on your own machine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Shuoxun Wen" }]
keywords = ["mcp", "model-context-protocol", "claude", "moodle", "edstem", "monash", "cli", "study-tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "pypdf>=4.0",
]

[project.optional-dependencies]
# 录播字幕：下载 Zoom 录像并用 whisper 转写、取 YouTube 字幕。依赖大（约 1 GB），想要才装。
media = [
    "faster-whisper>=1.0",
    "yt-dlp[default]>=2025.1.1",
    "deno>=2.0",
]

[project.urls]
Homepage = "https://github.com/Waldo0926/monash-study-kit"
Issues = "https://github.com/Waldo0926/monash-study-kit/issues"
Changelog = "https://github.com/Waldo0926/monash-study-kit/blob/main/CHANGELOG.md"

[project.scripts]
monash = "monash_study_kit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/monash_study_kit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/monash_study_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# 只开会真出 bug 的那类检查（语法错误、未定义的名字、没用的 import），代码风格不强求
select = ["E9", "F"]
