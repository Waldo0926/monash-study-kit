name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:      # release.yml 发版前先跑一遍

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python }}
      - name: ruff（语法错误、未定义的名字、没用的 import）
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uvx ruff@0.6.9 check src tests
      - run: uv run pytest -q
      - name: CLI 能启动
        run: uv run monash --version

  package:
    # 打出来的包装进一个干净的 venv 能不能用：只在仓库里 uv run 测不出漏打包的文件
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 打包并检查内容
        shell: bash
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/monash_study_kit/__init__.py)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          uv build
          uv run --no-project scripts/check_dist.py dist "$version"
      - name: 装进干净的 venv，跑 --version、help 和 MCP 握手
        shell: bash
        run: |
          uv venv --python 3.10 smoke
          if [ -d smoke/Scripts ]; then py=smoke/Scripts/python.exe exe=smoke/Scripts/monash.exe; else py=smoke/bin/python exe=smoke/bin/monash; fi
          uv pip install --python "$py" dist/*.whl
          "$py" scripts/smoke_test.py "$exe" "$VERSION"

  version-bump:
    # 朋友那边的更新提示比的是 main 上的 __version__：改了代码却没改版本号，他们就收不到提示
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 改了 src/ 就要改版本号
        run: |
          base=origin/${{ github.base_ref }}
          if git diff --quiet "$base"...HEAD -- src/; then
            echo "没改 src/，不用改版本号"; exit 0
          fi
          old=$(git show "$base":src/monash_study_kit/__init__.py | sed -n 's/^__version__ = "\(.*\)"/\1/p')
          new=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/monash_study_kit/__init__.py)
          echo "main: $old  →  这个 PR: $new"
          python3 -c "import sys; p=lambda v: tuple(int(x) for x in v.split('.')); sys.exit(0 if p('$new') > p('$old') else 1)" \
            || { echo "::error file=src/monash_study_kit/__init__.py::改了 src/ 就把 __version__ 加一（修 bug 加最后一位，加功能加中间一位），不然朋友收不到更新提示"; exit 1; }
